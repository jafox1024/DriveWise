# DriveWise 自动打包发布工作流
#
# 触发方式
#   - 推送到主分支（main / master）后自动打包并创建 GitHub Release
#   - 也可在仓库 Actions 页面手动触发（workflow_dispatch）
#
# 版本号唯一来源
#   build/config.yml 的 info.version，由 tools/readver 读取。
#   该值同时通过 -ldflags 注入二进制（backend/sysinfo.AppVersion），
#   因此 Release 标签与程序「关于」里显示的版本始终一致。
#
# 标签规则（保证每次提交都能发布出独立的新版本，不会因标签冲突失败）
#   1) v{version} 不存在        → 用 v{version}，例如 v0.2.0
#   2) v{version} 已被占用      → 追加构建号，例如 v0.2.0-build.57
#
# 发布产物
#   - DriveWise-{tag}.exe                    裸可执行文件
#   - DriveWise-{tag}-windows-amd64.zip      含 exe 与 README 的压缩包
#
# 代码签名（可选，强烈建议配置）
#   未签名的 exe 在用户机器上会触发 SmartScreen 提示，并有一定概率被国产杀软
#   （火绒 / 360 等）按启发式整体判黑（例：无签名 + 含系统级清理/进程操作特征）。
#   仓库配置下面两个 Secret 后，本工作流会在打包前自动签名，无需改代码：
#     - WINDOWS_SIGN_PFX_BASE64    .pfx 证书文件的 Base64（certutil -encode 或
#                                  PowerShell [Convert]::ToBase64String(ReadAllBytes)）
#     - WINDOWS_SIGN_PFX_PASSWORD  .pfx 密码
#   未配置时签名步骤自动跳过，发布流程不受影响。

name: Release

env:
  # wails3 CLI 版本：与 go.mod 中 github.com/wailsapp/wails/v3 保持一致
  # （用 `wails3 version` 查看本地版本）。升级前先执行：
  #   go get github.com/wailsapp/wails/v3@<version>
  #   go install github.com/wailsapp/wails/v3/cmd/wails3@<version>
  #   wails3 generate bindings -ts      # 确认绑定无变化或已同步
  # 若版本不同步，CI 重新生成的 TS 绑定可能与本仓库提交的绑定不一致，
  # 导致前端 vue-tsc 报错。
  WAILS_CLI_VERSION: v3.0.0-beta.19

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 创建 Release / 打标签需要内容写权限
permissions:
  contents: write

# 同一分支串行发布，避免并发运行互相抢占标签
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 打包并发布 (Windows amd64)
    runs-on: windows-latest
    env:
      # 证书相关 Secret 会在未配置时展开为空串，签名步骤据此自动跳过。
      # 注意：必须放在 job 级 env（工作流级 env 不允许引用 secrets）。
      SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}

    steps:
      - name: 拉取代码（含全部标签，用于判断版本标签是否已存在）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Go（版本跟随 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 wails3 CLI
        shell: bash
        run: |
          set -euo pipefail
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_CLI_VERSION}"

      - name: 将 Go bin 目录加入 PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 解析版本号与发布标签
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(go run ./tools/readver)"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "解析结果：version=${VERSION}  tag=${TAG}"

      - name: 构建（生成绑定 → 构建前端 → 编译 exe）
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          # 走项目自带 Taskfile（wails3 内置任务运行器，与本地构建一致）：
          # go mod tidy → npm install --legacy-peer-deps → wails3 generate bindings
          # → npm run build → wails3 generate syso → go build（生产参数）
          wails3 task build ARCH=amd64

      - name: 校验构建产物
        shell: bash
        run: |
          set -euo pipefail
          ls -la bin/
          test -f bin/drivewise.exe
          echo "构建产物就绪：bin/drivewise.exe"

      - name: 代码签名（可选，配置证书 Secret 后自动生效）
        if: env.SIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'drivewise-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe 未找到（Windows SDK 缺失）' }
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 'bin/drivewise.exe'
          if ($LASTEXITCODE -ne 0) { throw "signtool 签名失败，退出码 $LASTEXITCODE" }
          Remove-Item $pfx -Force
          Write-Host '签名完成：bin/drivewise.exe'

      - name: 打包发布文件（zip + 裸 exe）
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $dir = "release/DriveWise-$tag-windows-amd64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "bin/drivewise.exe" "$dir/DriveWise.exe"
          Copy-Item "README.md" "$dir/README.md"
          Compress-Archive -Path "$dir/*" -DestinationPath "release/DriveWise-$tag-windows-amd64.zip" -Force
          Copy-Item "bin/drivewise.exe" "release/DriveWise-$tag.exe"
          Get-ChildItem release -Recurse | Select-Object FullName, Length

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DriveWise ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/DriveWise-${{ steps.ver.outputs.tag }}.exe
            release/DriveWise-${{ steps.ver.outputs.tag }}-windows-amd64.zip
